<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d9bff"/>
      <stop offset="0.55" stop-color="#0a6cff"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f45"/>
      <stop offset="1" stop-color="#151827"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f5c"/>
      <stop offset="1" stop-color="#262a40"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001a4d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="470" cy="40" r="170" fill="#fff" opacity="0.10"/>
  <circle cx="470" cy="40" r="110" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="5"/>

  <g filter="url(#shadow)">
    <!-- Cüzdandan taşan kartlar -->
    <rect x="138" y="120" width="210" height="130" rx="18" fill="#ff9f0a" transform="rotate(-14 243 185)"/>
    <rect x="168" y="112" width="210" height="130" rx="18" fill="#30d158" transform="rotate(-5 273 177)"/>
    <rect x="186" y="150" width="150" height="16" rx="8" fill="#fff" opacity="0.55" transform="rotate(-5 273 177)"/>

    <!-- Gövde -->
    <rect x="96" y="196" width="320" height="210" rx="34" fill="url(#wallet)"/>
    <rect x="114" y="214" width="284" height="174" rx="22" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="3" stroke-dasharray="10 9"/>

    <!-- Kapak ve çıtçıt -->
    <path d="M300 258 h132 a22 22 0 0 1 22 22 v50 a22 22 0 0 1 -22 22 h-132 a34 34 0 0 1 0 -94 z" fill="url(#flap)"/>
    <circle cx="318" cy="305" r="19" fill="#ffd60a"/>
    <circle cx="318" cy="305" r="8" fill="#b38f00"/>
  </g>
</svg>
